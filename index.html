<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #050505; color: #00ffcc; font-family: 'Courier New', monospace; text-align: center; overflow: hidden; touch-action: none; }
        #ui { position: absolute; top: 10px; width: 100%; pointer-events: none; }
        canvas { display: block; width: 100vw; height: 80vh; background: #111; border-bottom: 5px solid #ff00ff; }
        #controls { padding: 20px; }
        button { background: transparent; border: 2px solid #00ffcc; color: #00ffcc; padding: 15px 30px; font-size: 20px; border-radius: 10px; }
    </style>
</head>
<body>

<div id="ui">
    <h2 id="status">NEON ARENA</h2>
    <div id="score">Tú: 0 | Rival: 0</div>
</div>

<canvas id="canvas"></canvas>

<div id="controls">
    <button onclick="host()">CREAR ARENA</button>
    <button onclick="join()">UNIRSE</button>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const peer = new Peer();
    let conn, score = [0, 0];
    let me = {x: 100, y: 100, r: 20}, rival = {x: 200, y: 200, r: 20}, ball = {x: 150, y: 150, r: 10};

    // Ajuste de pantalla
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight * 0.8;

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // Dibujar elementos (Neón)
        ctx.fillStyle = '#00ffcc';
        ctx.beginPath(); ctx.arc(me.x, me.y, me.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ff00ff';
        ctx.beginPath(); ctx.arc(rival.x, rival.y, rival.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffff00';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
        requestAnimationFrame(draw);
    }

    canvas.addEventListener('touchmove', (e) => {
        me.x = e.touches[0].clientX;
        me.y = e.touches[0].clientY;
        if(conn) conn.send({type: 'move', x: me.x, y: me.y});
    });

    function host() {
        document.getElementById('status').innerText = "ID: " + peer.id;
        peer.on('connection', c => { conn = c; setup(); });
    }

    function join() {
        let id = prompt("ID del rival:");
        conn = peer.connect(id);
        setup();
    }

    function setup() {
        conn.on('data', data => {
            if(data.type === 'move') { rival.x = data.x; rival.y = data.y; }
        });
    }

    draw();
</script>
</body>
</html>
