<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hacker OS - Mobile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contenedor Principal (Simulador en PC, Pantalla completa en Móvil) -->
    <div class="smartphone">
        
        <!-- Elementos físicos (Solo visibles en PC) -->
        <div class="physical-buttons">
            <div class="side-button power" id="powerBtn"></div>
        </div>

        <div class="screen" id="screen">
            <!-- Capas de fondo -->
            <div class="wallpaper"></div>
            <div class="overlay"></div>

            <!-- Barra de Estado Superior -->
            <div class="status-bar">
                <div class="time-box" id="clock">14:53</div>
                <div class="status-icons">
                    <span>📶</span>
                    <span>🔋 99%</span>
                </div>
            </div>

            <!-- Notch (Cámara/Sensores - Solo PC) -->
            <div class="notch"></div>

            <!-- Grilla de Aplicaciones -->
            <main class="app-grid">
                <div class="apk" onclick="openApp('Terminal')">
                    <div class="icon-wrapper terminal">📟</div>
                    <span>Terminal</span>
                </div>
                <div class="apk" onclick="openApp('SQL Inject')">
                    <div class="icon-wrapper sql-inject">☣️</div>
                    <span>SQL Inject</span>
                </div>
                <div class="apk" onclick="openApp('DarkWeb')">
                    <div class="icon-wrapper darkweb">🌐</div>
                    <span>DarkWeb</span>
                </div>
                <div class="apk" onclick="openApp('Signal')">
                    <div class="icon-wrapper signal">💬</div>
                    <span>Signal</span>
                </div>
                <div class="apk" onclick="openApp('Crypto')">
                    <div class="icon-wrapper crypto">₿</div>
                    <span>Crypto</span>
                </div>
                <div class="apk" onclick="openApp('Config')">
                    <div class="icon-wrapper config">⚙️</div>
                    <span>Config</span>
                </div>
            </main>

            <!-- Dock Inferior (Apps fijas) -->
            <div class="dock">
                <div class="dock-icon">📞</div>
                <div class="dock-icon">📟</div>
                <div class="dock-icon">📂</div>
            </div>

            <!-- Barra de gestos Home -->
            <div class="home-bar"></div>
        </div>
    </div>

    <script src="os.js"></script>
</body>
</html>
