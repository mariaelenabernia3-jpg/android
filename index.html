<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #050505; color: #fff; font-family: sans-serif; text-align: center; overflow: hidden; touch-action: none; }
        canvas { display: block; width: 100vw; height: 70vh; background: #111; }
        #ui { padding: 10px; }
        button { background: #ff00ff; color: white; border: none; padding: 15px; margin: 5px; border-radius: 8px; font-weight: bold; }
        #log { color: #00ffcc; font-size: 14px; }
    </style>
</head>
<body>

<div id="ui">
    <div id="log">Estado: Esperando conexión...</div>
    <button onclick="copyId()">Copiar ID para WhatsApp</button>
    <button onclick="connectToRival()">Unirse con ID</button>
</div>
<canvas id="canvas"></canvas>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const log = document.getElementById('log');
    
    // Inicializar Peer
    const peer = new Peer(); 
    let conn;
    let me = {x: 100, y: 100}, rival = {x: 200, y: 200};

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight * 0.7;

    // --- CONEXIÓN Y COPIAR ---
    peer.on('open', id => {
        log.innerText = "Tu ID (compártelo): " + id;
    });

    function copyId() {
        navigator.clipboard.writeText(peer.id).then(() => alert("ID copiado: " + peer.id));
    }

    // El que recibe la conexión
    peer.on('connection', c => {
        conn = c;
        setupConnection();
    });

    // El que se une
    function connectToRival() {
        let id = prompt("Pega aquí el ID que recibiste:");
        conn = peer.connect(id);
        setupConnection();
    }

    function setupConnection() {
        conn.on('open', () => {
            log.innerText = "¡CONECTADO CON EL RIVAL!";
            conn.send({type: 'hi', x: me.x, y: me.y}); // Saludo inicial
        });
        
        conn.on('data', data => {
            if(data.type === 'move') {
                rival.x = data.x;
                rival.y = data.y;
            }
        });
    }

    // --- JUEGO ---
    canvas.addEventListener('touchmove', (e) => {
        me.x = e.touches[0].clientX;
        me.y = e.touches[0].clientY;
        if(conn && conn.open) {
            conn.send({type: 'move', x: me.x, y: me.y});
        }
        draw();
    });

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ffcc'; // Tú
        ctx.fillRect(me.x - 20, me.y - 20, 40, 40);
        ctx.fillStyle = '#ff00ff'; // Rival
        ctx.fillRect(rival.x - 20, rival.y - 20, 40, 40);
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
