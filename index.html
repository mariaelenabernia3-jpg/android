<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #1a1a2e; color: white; font-family: 'Arial', sans-serif; text-align: center; margin: 0; overflow: hidden; }
        #game-ui { padding: 20px; }
        canvas { background: #0f3460; border: 4px solid #e94560; border-radius: 10px; cursor: crosshair; box-shadow: 0 0 20px #e94560; }
        button { background: #e94560; color: white; border: none; padding: 15px 30px; border-radius: 25px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #ff2e63; transform: scale(1.1); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="game-ui">
    <h1>Neon Duel</h1>
    <div id="menu">
        <button onclick="startHost()">Crear Partida</button>
        <button onclick="findGames()">Buscar Partidas</button>
    </div>
    <div id="status"></div>
    <canvas id="canvas" width="300" height="300" class="hidden"></canvas>
</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    const peer = new Peer(); // PeerJS gestiona la conexión
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let conn;
    let playerX = 150, playerY = 150;
    let enemyX = 0, enemyY = 0;

    // --- LÓGICA DE JUEGO ---
    function draw() {
        ctx.clearRect(0, 0, 300, 300);
        // Jugador
        ctx.fillStyle = '#e94560';
        ctx.fillRect(playerX-25, playerY-25, 50, 50);
        // Enemigo
        ctx.fillStyle = '#4ecca3';
        ctx.fillRect(enemyX-25, enemyY-25, 50, 50);
    }

    canvas.addEventListener('touchmove', (e) => {
        playerX = e.touches[0].clientX - canvas.offsetLeft;
        playerY = e.touches[0].clientY - canvas.offsetTop;
        if(conn) conn.send({x: playerX, y: playerY});
        draw();
    });

    // --- CONEXIÓN SIMPLE ---
    function startHost() {
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('status').innerText = "Esperando jugador... Comparte tu ID: " + peer.id;
        peer.on('connection', c => {
            conn = c;
            startGame();
        });
    }

    function findGames() {
        const id = prompt("Introduce el ID de tu amigo:");
        conn = peer.connect(id);
        startGame();
    }

    function startGame() {
        document.getElementById('status').innerText = "¡Conectado! Muévete.";
        document.getElementById('canvas').classList.remove('hidden');
        conn.on('data', data => {
            enemyX = data.x; enemyY = data.y;
            draw();
        });
    }
</script>
</body>
</html>
